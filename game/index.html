<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Courier — Island Run</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87bfe8;
    font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .panel { position: absolute; background: rgba(8, 22, 38, 0.72); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(2px); }
  #flight-panel { top: 14px; left: 14px; width: 178px; }
  #mission-panel { top: 14px; right: 14px; width: 178px; text-align: right; }
  .row { display: flex; justify-content: space-between; font-size: 15px; line-height: 1.5; }
  .row span { color: #9fd0ff; letter-spacing: 1px; font-size: 12px; }
  .row b { font-variant-numeric: tabular-nums; }
  #compass { position: relative; height: 22px; margin-top: 6px; overflow: hidden;
    border-top: 1px solid rgba(255,255,255,0.25); font-size: 12px; }
  #compass-strip span { position: absolute; transform: translateX(-50%); top: 3px; color: #cfe8ff; }
  #compass-needle { position: absolute; left: 50%; top: 0; transform: translateX(-50%); color: #ffd23f; }
  #horizon { display: block; margin-top: 8px; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; }
  .bar { position: relative; height: 16px; background: rgba(255,255,255,0.15); border-radius: 8px;
    margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #37d67a; }
  .bar em { position: absolute; inset: 0; text-align: center; font-size: 10px; font-style: normal;
    letter-spacing: 1px; line-height: 16px; color: #fff; text-shadow: 0 1px 2px #000; }
  #gate-panel { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; background: rgba(8,22,38,0.72);
    border: 1px solid rgba(255,210,63,0.5); border-radius: 10px; padding: 8px 14px; }
  #gate-arrow { font-size: 26px; color: #ffd23f; transition: transform 0.15s; }
  #gate-label { font-weight: 700; font-size: 15px; }
  #gate-dist { font-size: 12px; color: #9fd0ff; }
  #warn-panel { position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; }
  #warn-panel span { display: none; background: #c81e1e; color: #fff; font-weight: 800;
    letter-spacing: 1px; font-size: 13px; padding: 5px 10px; border-radius: 6px; }
  #warn-panel span.on { display: inline-block; animation: blink 0.7s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  #toast { position: absolute; top: 96px; left: 50%; transform: translateX(-50%);
    font-size: 21px; font-weight: 700; color: #ffd23f; text-shadow: 0 2px 6px #000;
    opacity: 0; transition: opacity 0.3s; }
  #toast.show { opacity: 1; }
  #centre-dot { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 20px; color: rgba(255,255,255,0.75); text-shadow: 0 1px 3px #000; }
  #help { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: rgba(255,255,255,0.85); text-shadow: 0 1px 3px #000; white-space: nowrap; }
  #overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(4, 16, 30, 0.55); z-index: 10; }
  #overlay.show { display: flex; }
  #overlay .card, #overlay h1, #overlay p { text-align: center; }
  #overlay h1 { font-size: 52px; letter-spacing: 6px; margin: 0 0 6px; text-shadow: 0 3px 12px #000; }
  #overlay .sub { font-size: 18px; color: #ffd23f; }
  #overlay p { max-width: 560px; margin: 10px auto; font-size: 16px; line-height: 1.5;
    text-shadow: 0 1px 4px #000; }
  #overlay .keys { font-size: 13px; color: #cfe8ff; }
  #overlay button { pointer-events: auto; font-size: 20px; font-weight: 800; letter-spacing: 2px;
    padding: 14px 34px; border: none; border-radius: 10px; cursor: pointer;
    background: #ffb020; color: #231303; box-shadow: 0 4px 0 #b97a00; margin-top: 14px; }
  #overlay button:hover { background: #ffc44d; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sky Courier Island Run: fly a prop plane through golden gates over an island archipelago"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud"></div>
<div id="overlay"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
